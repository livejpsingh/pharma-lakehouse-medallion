name: CI - Medallion Lakehouse Pipeline

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

  test-unit:
    name: Unit & Data Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-dotenv

      - name: Run Unit Tests
        run: pytest tests/test_config.py tests/test_data_quality.py

  integration-medallion:
    name: End-to-End Medallion Pipeline Test
    runs-on: ubuntu-latest
    needs: [lint, test-unit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create exports and delta directories
        run: |
          mkdir -p exports data/delta

      - name: Run End-to-End Pipeline via Docker Compose
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from pipeline

      - name: Fix file permissions for artifacts
        run: |
          sudo chmod -R a+rX exports data

      - name: Set up Python for Export Validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-dotenv

      - name: Validate Gold Exports & Data Quality
        run: |
          pytest tests/test_gold_exports.py

      - name: Archive Gold CSV Exports
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-gold-exports
          path: exports/*.csv
          if-no-files-found: error

      - name: Cleanup Docker containers
        if: always()
        run: |
          docker compose down -v
