name: CI - Medallion Lakehouse Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

  test-unit:
    name: Unit & Data Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-dotenv

      - name: Run Unit Tests
        run: pytest tests/test_config.py tests/test_data_quality.py

  integration-medallion:
    name: End-to-End Medallion Pipeline Test
    runs-on: ubuntu-latest
    needs: [lint, test-unit]

    services:
      minilake:
        image: ghcr.io/dmux/minilake:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000/_minilake/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Java 17 for Spark
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute End-to-End Medallion Pipeline
        env:
          MINILAKE_HOST: "http://localhost:8000"
          MINILAKE_TOKEN: "dev"
        run: |
          python scripts/run_all.py

      - name: Validate Gold Exports & Data Quality
        run: |
          pytest tests/test_gold_exports.py

      - name: Archive Gold CSV Exports
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-gold-exports
          path: exports/*.csv
          if-no-files-found: error
